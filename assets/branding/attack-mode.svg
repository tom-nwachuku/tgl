<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#ff3b30"/>
    </marker>
  </defs>
  <rect width="1200" height="620" fill="#0b0e13"/>
  <text x="60" y="80" fill="#ffffff" font-size="34" font-weight="700" letter-spacing="4">ATTACK MODE</text>
  <text x="60" y="112" fill="#ff3b30" font-size="16" letter-spacing="6">THE ASSAULT</text>

  <g>
    <rect x="30" y="180" width="240" height="220" rx="10" fill="#12161d" stroke="#2a3140" stroke-width="2"/>
    <text x="150" y="225" fill="#ff3b30" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">1. GO</text>
    <text x="150" y="260" fill="#c7cdd6" font-size="14" text-anchor="middle">"Go attack mode."</text>
    <text x="150" y="284" fill="#c7cdd6" font-size="14" text-anchor="middle">The battle cry.</text>
    <text x="150" y="308" fill="#9aa4b2" font-size="13" text-anchor="middle">Launches only on</text>
    <text x="150" y="330" fill="#9aa4b2" font-size="13" text-anchor="middle">a signed plan.</text>
  </g>

  <line x1="276" y1="290" x2="324" y2="290" stroke="#ff3b30" stroke-width="2" marker-end="url(#arrow2)"/>

  <g>
    <rect x="330" y="180" width="240" height="220" rx="10" fill="#12161d" stroke="#2a3140" stroke-width="2"/>
    <text x="450" y="225" fill="#ff3b30" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">2. EXECUTE</text>
    <text x="450" y="260" fill="#c7cdd6" font-size="14" text-anchor="middle">One subagent per slice.</text>
    <text x="450" y="284" fill="#c7cdd6" font-size="14" text-anchor="middle">Fresh context per slice.</text>
    <text x="450" y="308" fill="#9aa4b2" font-size="13" text-anchor="middle">Review each against the spec</text>
    <text x="450" y="330" fill="#9aa4b2" font-size="13" text-anchor="middle">before the next begins.</text>
  </g>

  <line x1="576" y1="290" x2="624" y2="290" stroke="#ff3b30" stroke-width="2" marker-end="url(#arrow2)"/>

  <g>
    <rect x="630" y="180" width="240" height="220" rx="10" fill="#1a1214" stroke="#ff3b30" stroke-width="2"/>
    <text x="750" y="225" fill="#ff3b30" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">3. VERIFY</text>
    <text x="750" y="260" fill="#c7cdd6" font-size="14" text-anchor="middle">Red team.</text>
    <text x="750" y="284" fill="#c7cdd6" font-size="14" text-anchor="middle">A fresh agent plays adversary.</text>
    <text x="750" y="308" fill="#9aa4b2" font-size="13" text-anchor="middle">Break it before they do.</text>
    <text x="750" y="330" fill="#9aa4b2" font-size="13" text-anchor="middle">Real surface, real size.</text>
  </g>

  <line x1="876" y1="290" x2="924" y2="290" stroke="#ff3b30" stroke-width="2" marker-end="url(#arrow2)"/>

  <g>
    <rect x="930" y="180" width="240" height="220" rx="10" fill="#12161d" stroke="#2a3140" stroke-width="2"/>
    <text x="1050" y="225" fill="#ff3b30" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="2">4. SHIP</text>
    <text x="1050" y="260" fill="#c7cdd6" font-size="14" text-anchor="middle">Release checklist.</text>
    <text x="1050" y="284" fill="#c7cdd6" font-size="14" text-anchor="middle">Ledger entry.</text>
    <text x="1050" y="308" fill="#9aa4b2" font-size="13" text-anchor="middle">One honest paragraph</text>
    <text x="1050" y="330" fill="#9aa4b2" font-size="13" text-anchor="middle">on what was learned.</text>
  </g>

  <text x="60" y="480" fill="#9aa4b2" font-size="16">Refuses without signed orders.</text>
  <text x="60" y="512" fill="#5b6472" font-size="14" font-style="italic">Attack Mode cuts once.</text>
</svg>
