# TGL connector on Fly.io. Build with: fly deploy --remote-only
app = "tgl-summitx"
primary_region = "dfw"

[env]
  PORT = "8000"
  TGL_PUBLIC_BASE_URL = "https://tgl-summitx.fly.dev"

[[services]]
  internal_port = 8000
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true

  [[services.ports]]
    handlers = ["http"]
    port = 80

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "get"
    path = "/"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
