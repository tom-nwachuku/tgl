name: Verify TGL
on:
  pull_request:
  push:
    branches: ['codex/**']
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r connector/requirements.txt pytest
      - run: python scripts/sync_bundle.py --check
      - run: python -m pytest -q
